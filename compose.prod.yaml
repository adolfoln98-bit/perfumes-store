name: perfumes-prod

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env.prod
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18.4
    restart: unless-stopped
    env_file:
      - .env.postgres.prod
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
  
  migrations:
    build: .
    profiles:
      - migration
    env_file:
      - .env.migrations.prod
    command: ["alembic", "-x", "prod=true", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: